#----------------- MPC param -----------------#
simulation: true
perfect_simu: false
frequency: 100.0
ctrl_delay: 0.0
sfc_dis: 0.3

thrust_limit: 0.98
hover_esti: true
hover_perc: 0.758
uav_mass: 1.735

yaw_ctrl_flag: true
yaw_gain: 0.6

goal_x: 0.0
goal_y: 0.0
goal_z: 1.0

astar:
  resolution: 0.2
  map_x_size: 10.0
  map_y_size: 10.0
  map_z_size: 3.0 #天花板高度
  expand_dyn: 0.4 #   用于**A\*路径规划时**的障碍物膨胀。规划时膨胀更大，让路径离障碍物更远，留出余量。
  expand_fix: 0.2 #   用于**实时检测当前路径是否碰到障碍物**，触发重规划。固定值，代表无人机物理安全距离。

fsm:
  ref_dis: 5 # 每个MPC步长跳过5个路径点
  path_dis: 0.05 # 路径点间距0.05m
#v_r = ref_dis * path_dis / MPC_STEP = 5 * 0.05 / 0.1 = 2.5 m/s

mpc:
  horizon: 15
  step: 0.1

  R_p: 2000.0
  R_v: 200.0
  R_a: 200.0
  R_u: 200.0
  R_u_con: 0.5

  # 终端权重
  R_pN: 2000.0
  R_vN: 200.0
  R_aN: 200.0

  D_x: 0.0
  D_y: 0.0
  D_z: 0.0

  vx_min: -5.0
  vy_min: -5.0
  vz_min: -5.0
  vx_max: 5.0
  vy_max: 5.0
  vz_max: 5.0

  ax_min: -20.0
  ay_min: -20.0
  az_min: -10.0
  ax_max: 20.0
  ay_max: 20.0
  az_max: 20.0

  ux_min: -50.0
  uy_min: -50.0
  uz_min: -50.0
  ux_max: 50.0
  uy_max: 50.0
  uz_max: 50.0
