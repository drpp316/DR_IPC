#----------------- MPC param for MARS UAV Sim (Obstacle Avoid) -----------------#
simulation: true
perfect_simu: false
frequency: 100.0
ctrl_delay: 0.0
sfc_dis: 0.25

thrust_limit: 0.9
hover_esti: false
hover_perc: 0.68

yaw_ctrl_flag: true
use_pos_cmd: false
yaw_freeze_goal_dist: 0.3

goal_x: 0.0
goal_y: 0.0
goal_z: 1.0
min_goal_z: 0.5
pred_vis_steps: 5 # RViz显示预测前k步

dob:
  eso_bandwidth: 0.5
  kf_process_noise_scale: 3.0
  kf_measurement_noise_scale: 0.1

  interconnected_mode: false
  use_kf_state_for_nmpc: false
  use_kf_attitude_for_nmpc: false
  require_mavros_state_for_dob: false

astar:
  resolution: 0.1
  map_x_size: 20.0
  map_y_size: 20.0
  map_z_size: 3.0
  expand_dyn: 0.6
  expand_fix: 0.4

fsm:
  ref_dis: 5
  path_dis: 0.05
  ref_v_max: 2.0

mpc:
  horizon: 20
  step: 0.05
  model_mass: 1.735

  R_p: 40.0
  R_v: 4

  R_yaw: 15.0 #偏航角增益
  R_phi: 5.0 #其余的姿态角增益

  R_pN: 10.0
  R_vN: 1.0
  R_yawN: 8.0
  R_phiN: 1.0

  R_w: 2
  #R_T: 1.10
  #R_T: 0.030
  R_T: 0.001
  R_sfc_eps: 0.1 # SFC 约束权重

  #约束
  wx_max: 30.0
  wy_max: 30.0
  wz_max: 30.0
  T_min: 0.0
  T_max: 40.0

  sfc_active_planes: 6 #max=10
  sfc_apply_steps: 2

  log_sfc_constraints: true
  debug_disable_sfc: false
