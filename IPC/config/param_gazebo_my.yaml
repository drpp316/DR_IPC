#----------------- MPC param -----------------#
simulation: true
perfect_simu: false
frequency: 100.0
ctrl_delay: 0.0
sfc_dis: 0.3

thrust_limit: 0.98
hover_esti: true
hover_perc: 0.758
uav_mass: 1.735

yaw_ctrl_flag: true
yaw_gain: 0.6

goal_x: 0.0
goal_y: 0.0
goal_z: 1.0

astar:
  resolution: 0.2
  map_x_size: 10.0
  map_y_size: 10.0
  map_z_size: 3.0 #天花板高度
  expand_dyn: 0.4 #   用于**A\*路径规划时**的障碍物膨胀。规划时膨胀更大，让路径离障碍物更远，留出余量。
  expand_fix: 0.2 #   用于**实时检测当前路径是否碰到障碍物**，触发重规划。固定值，代表无人机物理安全距离。

fsm:
  ref_dis: 5 # 每个MPC步长跳过5个路径点
  path_dis: 0.05 # 路径点间距0.05m
#v_r = ref_dis * path_dis / MPC_STEP = 5 * 0.05 / 0.1 = 2.5 m/s

mpc:
  horizon: 15
  step: 0.1

  R_p: 500.0
  R_v: 20.0
  R_phi: 0.0 # 新增：替换 R_a (姿态误差)
  # 输入权重
  R_T: 1.01 # 新增：替换 R_u (推力增量)
  R_w: 1.1 # 新增：替换 R_u_con (角速度)
  R_w_con: 0.1 # 新增：角速度变化率惩罚

  # 终端权重
  R_pN: 500.0
  R_vN: 20.0
  R_phiN: 0.0 # 新增：替换 R_aN

  vx_min: -5.0
  vy_min: -5.0
  vz_min: -5.0
  vx_max: 5.0
  vy_max: 5.0
  vz_max: 5.0

  # 角速度约束 (新增，替换 ax/ay/az 约束)
  wx_min: -0.8
  wx_max: 0.8
  wy_min: -0.8
  wy_max: 0.8
  wz_min: -0.5
  wz_max: 0.5

  # 推力约束 (新增，替换 ux/uy/uz 约束)
  T_min: 5.1 # mass*g*0.3 = 1.735*9.81*0.3
  T_max: 42.5 # mass*g*2.5 = 1.735*9.81*2.5

