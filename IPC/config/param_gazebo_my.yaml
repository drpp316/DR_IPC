#----------------- MPC param -----------------#
simulation: true
perfect_simu: false
frequency: 100.0
ctrl_delay: 0.01
sfc_dis: 0.3

thrust_limit: 0.98
hover_esti: true
hover_perc: 0.758
uav_mass: 1.735

yaw_ctrl_flag: true
yaw_gain: 0.6
yaw_freeze_goal_dist: 0.4

goal_x: 0.0
goal_y: 0.0
goal_z: 1.0

eso_bandwidth: 0.5

astar:
  resolution: 0.2
  map_x_size: 10.0
  map_y_size: 10.0
  map_z_size: 3.0 #天花板高度
  expand_dyn: 0.4 #   用于**A\*路径规划时**的障碍物膨胀。规划时膨胀更大，让路径离障碍物更远，留出余量。
  expand_fix: 0.2 #   用于**实时检测当前路径是否碰到障碍物**，触发重规划。固定值，代表无人机物理安全距离。

fsm:
  ref_dis: 2 # 每个MPC步长跳过2个路径点
  path_dis: 0.05 # 路径点间距0.05m
  ref_v_max: 1.2 # 参考速度上限(m/s)，限制送入NMPC的v_ref
#v_r = ref_dis * path_dis / MPC_STEP = 2 * 0.05 / 0.01 = 10.0 m/s
#但最终会被 ref_v_max 限制到 1.2 m/s

mpc:
  disturbance_alpha: 0.1
  disturbance_alpha_z: 0.1
  disturbance_limit: 100.0
  disturbance_limit_z: 100.0

  log_sfc_constraints: true
  sfc_active_planes: 10 # 先保留10个最有效约束面
  sfc_apply_steps: 10 # 先只对最近1个预测步启用SFC，优先保证可行性

  horizon: 20 # 运行时有效预测步长(与ACADO_N保持一致, 总预测时域0.2s)
  step: 0.05 #与acado一致
  pred_vis_steps: 10 # RViz显示预测前？步

  R_p: 10.0
  R_v: 3

  R_yaw: 6.0 #偏航角增益
  R_phi: 3.0 #其余的姿态角增益

  R_pN: 20.0
  R_vN: 1.0
  R_yawN: 8.0
  R_phiN: 2.0

  R_w: 2
  R_T: 0.5
  R_sfc_eps: 0.01 # SFC软约束松弛量权重(先取中等，避免一上来又变成近似硬约束)
  sfc_eps_max: 500.0 # 单步最大可允许SFC违反量；法向量近似归一化时可理解为15cm
  wx_max: 1.0
  wy_max: 1.0
  wz_max: 2.0
  T_min: 1.0
  T_max: 40.0
