#----------------- MPC param for MARS UAV Sim -----------------#
simulation: true
perfect_simu: false
frequency: 100.0
ctrl_delay: 0.0
sfc_dis: 0.3

thrust_limit: 0.9
hover_esti: true
hover_perc: 0.68

yaw_ctrl_flag: true
yaw_freeze_goal_dist: 0.3

goal_x: 0.0
goal_y: 0.0
goal_z: 1.0
min_goal_z: 0.5 # 目标高度下限(避免贴地/落入未知点云区域)，GoalCallback/PathReplan都会夹到该高度

pred_vis_steps: 5 # RViz显示预测前k步

dob:
  eso_bandwidth: 2.0 # 干扰观测器极点(带宽)2.0
  kf_process_noise_scale: 3.0 # Q缩放(大一点=滤波更少, 更跟测量)
  kf_measurement_noise_scale: 0.1 # R缩放(小一点=更信任测量)

  interconnected_mode: false # KF<->DOB互联：KF滤波DOB状态，DOB反哺KF干扰
  use_kf_state_for_nmpc: false # NMPC状态源开关：false=里程计测量状态，true=使用KF滤波后的[p,v]
  use_kf_attitude_for_nmpc: false # NMPC姿态源开关：false=里程计姿态，true=KF滤波四元数

  require_mavros_state_for_dob: false #  true  关闭DOB； false 开启 DOB

astar:
  resolution: 0.2
  map_x_size: 10.0
  map_y_size: 10.0
  map_z_size: 3.0
  expand_dyn: 0.4
  expand_fix: 0.3

fsm:
  ref_dis: 3 # 每个MPC步长跳过2个路径点
  path_dis: 0.05 # 路径点间距0.05m
  ref_v_max: 1.0 # 参考速度上限(m/s)，限制送入NMPC的v_ref

mpc:
  horizon: 20 # 运行时有效预测步长(与ACADO_N保持一致, 总预测时域1s)
  step: 0.05 #与acado一致
  model_mass: 1.735 # 保证与ACADO 模型中的质量一致；因此若修改，需要同步修改quadrotor_rsmpc.cpp中const double m = 1.735; 并且编译。否则高度会有静差。

  #权重
  R_p: 50.0
  R_v: 4

  R_yaw: 15.0 #偏航角增益
  R_phi: 5.0 #其余的姿态角增益

  R_pN: 20.0
  R_vN: 1.0
  R_yawN: 8.0
  R_phiN: 1.0

  R_w: 2.0
  R_T: 0.3
  R_sfc_eps: 1 # SFC软约束松弛量权重(先取中等，避免一上来又变成近似硬约束)

  #约束
  wx_max: 0.85
  wy_max: 0.85
  wz_max: 4.0
  T_min: 0.0
  T_max: 40.0

  sfc_active_planes: 6 # 先保留15个最有效约束面
  sfc_apply_steps: 2 # 先只对最近k个预测步启用SFC，优先保证可行性
  log_sfc_constraints: false #记录SFC约束相关数据，供后续分析
  debug_disable_sfc: false
